services:
  postgres:
    image: postgres:18
    container_name: pufzi-postgres
    environment:
      POSTGRES_DB: pufzi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pufzi-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pufzi"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: pufzi-azurite
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - pufzi-azurite-data:/data

  api:
    build:
      context: .
      dockerfile: Pufzi.Api/Dockerfile
    container_name: pufzi-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pufzi;Username=postgres;Password=${POSTGRES_PASSWORD}

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenExpirationMinutes: 15
      Jwt__RefreshTokenExpirationDays: 30

      Brevo__ApiKey: ${BREVO_API_KEY}
      Brevo__SenderEmail: ${BREVO_SENDER_EMAIL}
      Brevo__SenderName: ${BREVO_SENDER_NAME}

      AzureBlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AzureBlobStorage__PublicContainerName: public

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

volumes:
  pufzi-postgres-data:
  pufzi-azurite-data: