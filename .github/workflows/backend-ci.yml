name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Pufzi.Backend.slnx

      - name: Build backend
        run: dotnet build Pufzi.Backend.slnx --configuration Release --no-restore

      - name: Build Docker image
        run: docker build -f Pufzi.Api/Dockerfile -t pufzi-backend .